<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Formulaires Netlify</title><meta name="robots" content="noindex"></head>
<body>
  <!-- Référence pour la détection des formulaires par Netlify (le site est rendu côté serveur).
       Les champs doivent correspondre à ceux de src/components/PiedDePage.astro. -->
  <form name="promos" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="text" name="code" />
    <input type="email" name="email" />
    <input type="checkbox" name="consentement" />
    <input name="bot-field" />
  </form>
</body>
</html>
